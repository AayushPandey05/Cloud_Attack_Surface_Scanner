services:
  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "5000:3000"
    env_file:
      - .env

  aws-audit:
    build:
      context: ./services/aws-audit
    ports:
      - "5001:3001"
    env_file:
      - .env

  slack-bot:
    build:
      context: ./services/slack-bot
    ports:
      - "5002:3002"
    env_file:
      - .env