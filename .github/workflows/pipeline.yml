# This is the CI/CD pipeline
# It runs automatically every time you push code to GitHub

name: Scanner CI/CD

on:
  push:
    branches:
      - main

jobs:

  # JOB 1 - Install packages and check for problems
  test:
    name: Install and Test
    runs-on: ubuntu-latest

    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packages
        run: npm install

      - name: Check for security issues in packages
        run: npm audit --audit-level=high

  # JOB 2 - Build the Docker image and push it
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test        # only runs if job 1 passed

    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t cloud-attack-surface-scanner .

      - name: Show the image was built
        run: docker images cloud-attack-surface-scanner
